# A throwaway WordPress for trying the plugin locally. Nothing here touches any real site.
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml run --rm cli wp core install --url=http://localhost:8089 \
#       --title="Schema Editor test" --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email
#   docker compose -f docker/docker-compose.yml run --rm cli wp plugin install seo-by-rank-math --activate
#   docker compose -f docker/docker-compose.yml run --rm cli wp plugin activate schema-editor
#   docker compose -f docker/docker-compose.yml run --rm cli wp schema-editor import /plugin/templates/examples/
#
# The site answers at http://localhost:8089 (admin / admin).

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8089:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'RANKMATH_DEBUG', true );
    volumes:
      - wp-data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/schema-editor:ro

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp-data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/schema-editor:ro
      - ..:/plugin:ro
    entrypoint: ["wp", "--path=/var/www/html"]

volumes:
  db-data:
  wp-data:
